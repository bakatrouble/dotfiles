# mise global config for this repository (MISE_CONFIG_DIR=~/.dotfiles).
# Sources are relative to this directory.
[dotfiles]
"~/.config/fish" = { source = "fish/.config/fish" }
"~/.config/nvim" = { source = "nvim/.config/nvim" }
"~/.fishrc" = { source = "shell/.fishrc" }
"~/.ssh/config" = { source = "ssh/config" }
"~/.ssh/hosts.d" = { source = "ssh/hosts.d" }
